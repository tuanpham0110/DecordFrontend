# Render Blueprint – tạo database PostgreSQL + backend API chỉ với một lần bấm.
# Render → New → Blueprint → chọn repo này.

databases:
  - name: muonglab-db
    plan: free
    region: singapore
    databaseName: muonglab
    user: muonglab

services:
  - type: web
    name: muonglab-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate
    # Chạy migration + nạp nội dung bài học mỗi lần khởi động (không đụng tới dữ liệu người học)
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: muonglab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://muonglab.vercel.app,https://decord-frontend.vercel.app
      - key: TRUST_PROXY
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      # Gửi email OTP qua Gmail (để trống thì mã OTP chỉ in ra log của Render)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Trợ lý AI
      - key: GEMINI_API_KEY
        sync: false
